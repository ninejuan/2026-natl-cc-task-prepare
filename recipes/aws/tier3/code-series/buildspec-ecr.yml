version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
  build:
    commands:
      - docker build -t $ECR_URI/lab-cb-app:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $ECR_URI/lab-cb-app:$IMAGE_TAG
      - echo Pushed $ECR_URI/lab-cb-app:$IMAGE_TAG
