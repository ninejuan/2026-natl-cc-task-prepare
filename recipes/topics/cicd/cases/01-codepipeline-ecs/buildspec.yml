version: 0.2
# CodeCommit 소스 루트에 이 파일 + Dockerfile 을 둔다.
# CodeBuild(privilegedMode:true) 에서 이미지 빌드→ECR push→imagedefinitions.json 산출.
# 환경변수 ECR_URI = <acct>.dkr.ecr.<region>.amazonaws.com (CodeBuild project env 로 주입)
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
  build:
    commands:
      - docker build -t $ECR_URI/lab-pipe:$CODEBUILD_RESOLVED_SOURCE_VERSION .
      - docker tag $ECR_URI/lab-pipe:$CODEBUILD_RESOLVED_SOURCE_VERSION $ECR_URI/lab-pipe:latest
      - docker push $ECR_URI/lab-pipe:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - docker push $ECR_URI/lab-pipe:latest
  post_build:
    commands:
      # ★ ECS Deploy 액션이 읽는 파일. container name 은 taskdef 의 name 과 정확히 일치("app").
      - printf '[{"name":"app","imageUri":"%s"}]' "$ECR_URI/lab-pipe:latest" > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
