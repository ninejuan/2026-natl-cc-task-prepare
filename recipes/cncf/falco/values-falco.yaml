# helm upgrade --install falco falcosecurity/falco -n falco --create-namespace -f values-falco.yaml

driver:
  kind: modern_ebpf      # EKS/AL2023 에서 이걸 쓴다. kmod 는 노드마다 모듈 빌드를 시도해 실패하기 쉽다

tty: true                # 로그를 즉시 flush. kubectl logs 로 바로 보인다

# DaemonSet 이므로 모든 노드에 떠야 한다. 안 뜬 노드의 이벤트는 잡히지 않는다.
tolerations:
  - operator: Exists

collectors:
  kubernetes:
    enabled: true        # k8s.ns.name, k8s.pod.name 필드를 채운다

falco:
  json_output: true      # grep/jq 로 파싱하려면 필수
  json_include_output_property: true
  log_level: info
  priority: debug        # 이 우선순위 이상만 출력. 대회에선 다 보는 게 낫다
  syscall_event_drops:
    actions: [log]
    rate: 0.03

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# 기본 룰셋은 그대로 두고 덧붙인다.
customRules:
  skills-rules.yaml: |-
    - rule: Shell in container
      desc: 컨테이너 안에서 대화형 쉘이 실행됨
      condition: >
        spawned_process and container
        and proc.name in (bash, sh, zsh, ash, dash)
      output: "쉘 실행 (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name cmd=%proc.cmdline)"
      priority: WARNING
      tags: [container, shell, skills]

    - rule: Read sensitive file
      desc: 민감 파일 읽기 시도
      condition: >
        open_read and container
        and fd.name in (/etc/shadow, /etc/passwd, /root/.ssh/id_rsa)
      output: "민감 파일 접근 (file=%fd.name ns=%k8s.ns.name pod=%k8s.pod.name proc=%proc.name)"
      priority: CRITICAL
      tags: [filesystem, skills]

    - rule: Package management in container
      desc: 컨테이너 안에서 패키지 매니저 실행 (이미지 무단 변경 징후)
      condition: >
        spawned_process and container
        and proc.name in (apk, apt, apt-get, yum, dnf, pip, pip3)
      output: "패키지 매니저 실행 (ns=%k8s.ns.name pod=%k8s.pod.name cmd=%proc.cmdline)"
      priority: WARNING
      tags: [container, skills]

    - rule: Outbound connection to unexpected port
      desc: 허용되지 않은 포트로 나가는 연결
      condition: >
        outbound and container
        and not fd.sport in (53, 80, 443, 8080)
      output: "예상치 못한 외부 연결 (ns=%k8s.ns.name pod=%k8s.pod.name conn=%fd.name)"
      priority: NOTICE
      tags: [network, skills]
