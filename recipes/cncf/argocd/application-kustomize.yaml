# CI 가 이미지 태그만 바꿔 커밋하는 구조에서 쓴다. kustomize.images 로 태그를 덮어쓴다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-kustomize
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/REPO.git
    targetRevision: main
    path: k8s/overlays/prod
    kustomize:
      images:
        - 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/skills-app:v1.0.0
      commonLabels:
        skills.kr/managed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
