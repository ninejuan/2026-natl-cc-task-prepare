# label 이 없으면 Argo CD 가 이 Secret 을 repo 자격증명으로 인식하지 않는다.
# password 에는 GitHub PAT 를 넣는다 (contents:read 권한).
apiVersion: v1
kind: Secret
metadata:
  name: repo-skills
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/OWNER/REPO.git
  username: OWNER
  password: ghp_REPLACE_ME
