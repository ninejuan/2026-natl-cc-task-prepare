# 환경 목록으로 Application 생성. dev/stg/prod 를 한 정의로 관리한다.
#
# ★ ApplicationSet 템플릿을 고친 뒤에는 **하드 리프레시**를 걸어라(실검증).
#   Application.spec 은 새 값(count: "3")으로 바뀌는데 live 리소스는 예전 값(replicas: 1)인 채로
#   status 가 `Synced` 로 뜨는 경우가 있다. 캐시된 매니페스트를 계속 쓰기 때문이다.
#     kubectl -n argocd annotate app app-prod argocd.argoproj.io/refresh=hard --overwrite
#   그래도 안 맞으면 대상 리소스를 지우면 자동으로 다시 만든다(automated.selfHeal).
#   확인: kubectl -n app-prod get deploy -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas
#
# 실검증: dev=1 / stg=2 / prod=3 으로 네임스페이스별 replicas 차등 생성 확인.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-envs
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            replicas: "1"
          - env: stg
            replicas: "2"
          - env: prod
            replicas: "3"
  template:
    metadata:
      name: "app-{{.env}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/OWNER/REPO.git
        targetRevision: main
        path: k8s/overlays/{{.env}}
        kustomize:
          replicas:
            - name: app-deploy
              count: "{{.replicas}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
