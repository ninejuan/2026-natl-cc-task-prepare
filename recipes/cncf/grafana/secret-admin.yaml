# 비번호가 들어가는 계정은 하드코딩하지 않는다. 아래 명령으로 만들고 이 파일은 형태 참고용으로만 쓴다.
#   kubectl create secret generic grafana-admin -n monitoring \
#     --from-literal=admin-user="skills$P" \
#     --from-literal=admin-password="HelloKrSkills!$P@"
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
stringData:
  admin-user: skills000
  admin-password: HelloKrSkills!000@
