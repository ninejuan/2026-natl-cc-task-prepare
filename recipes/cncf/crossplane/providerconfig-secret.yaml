# IRSA 가 안 될 때. Secret 을 먼저 만들어야 한다.
#   printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "$AK" "$SK" > /tmp/creds
#   kubectl create secret generic aws-creds -n crossplane-system --from-file=creds=/tmp/creds
#   rm /tmp/creds
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
