# "개발자가 한 줄로 요청하면 인프라 세트가 생성되도록" 요구의 1/3.
# 이건 API 스키마만 정의한다. 실제 조립은 composition.yaml, 사용은 claim.yaml.
#
# ★ Crossplane v2: apiextensions.crossplane.io/v1 은 deprecated 다(서버가 경고를 뱉는다).
#   v2 에서는 scope 에 LegacyCluster 가 없어졌고, XR 자체가 네임스페이스 리소스라
#   별도의 Claim(claimNames) 개념이 사라졌다. 개발자는 XR 을 직접 만든다.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xappstorages.skills.kr
spec:
  scope: Namespaced          # v2 기본값. Cluster 로 두면 클러스터 스코프 XR.
  group: skills.kr
  names:
    kind: XAppStorage
    plural: xappstorages
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                appName:
                  type: string
                region:
                  type: string
                  default: ap-northeast-2
              required: [appName]
