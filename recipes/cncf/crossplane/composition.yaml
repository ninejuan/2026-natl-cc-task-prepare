# XRD 를 실제 AWS 리소스로 조립한다. appName 하나로 버킷 + 테이블이 함께 생긴다.
#
# ★ Composition 은 이제 Pipeline 모드만 있다(spec.mode enum = [Pipeline]).
#   예전 spec.resources(네이티브 patch&transform)는 제거됐다 —
#   그대로 쓰면 `unknown field "spec.resources"` 로 거부된다.
#   같은 patch/transform 을 function-patch-and-transform 이 대신 수행한다.
#   먼저 function-patch-and-transform.yaml 을 적용할 것.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appstorage-aws
spec:
  compositeTypeRef:
    apiVersion: skills.kr/v1alpha1
    kind: XAppStorage
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta2      # v1beta1 은 provider v2.6.0 부터 deprecated
              kind: Bucket
              spec:
                forProvider:
                  region: ap-northeast-2
            patches:
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.appName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      fmt: "skills-%s-bucket"

          - name: table
            base:
              apiVersion: dynamodb.aws.upbound.io/v1beta2
              kind: Table
              spec:
                forProvider:
                  region: ap-northeast-2
                  billingMode: PAY_PER_REQUEST
                  hashKey: id
                  attribute:
                    - name: id
                      type: S
            patches:
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.appName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      fmt: "skills-%s-table"
