# XRD 를 실제 AWS 리소스로 조립한다. appName 하나로 버킷 + 테이블이 함께 생긴다.
#
# ★ Composition 은 이제 Pipeline 모드만 있다(spec.mode enum = [Pipeline]).
#   예전 spec.resources(네이티브 patch&transform)는 제거됐다 —
#   그대로 쓰면 `unknown field "spec.resources"` 로 거부된다.
#   같은 patch/transform 을 function-patch-and-transform 이 대신 수행한다.
#   먼저 function-patch-and-transform.yaml 을 적용할 것.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appstorage-aws
spec:
  compositeTypeRef:
    apiVersion: skills.kr/v1alpha1
    kind: XAppStorage
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              # ★★ Namespaced XRD(scope: Namespaced)는 **네임스페이스 MR 만** 조립할 수 있다(실검증).
              #   클러스터 스코프 MR(s3.aws.upbound.io)을 쓰면 XR 이 이렇게 멈춘다:
              #     "cannot apply cluster scoped composed resource ... for a namespaced composite resource"
              #   provider-aws v2 는 같은 리소스를 두 그룹으로 낸다:
              #     s3.aws.upbound.io      → Cluster 스코프 (v1beta1, v1beta2)
              #     s3.aws.m.upbound.io    → Namespaced    (v1beta1)   ← 여기 'm' 이 핵심
              #   XRD 를 scope: Cluster 로 둘 거면 반대로 위쪽(비-m)을 쓴다.
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: ap-northeast-2
            patches:
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.appName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      # ★ string.type 을 빼면 Composition 이 조용히 아무것도 안 만든다(실검증).
                      #   XR .status: "invalid Function input: ... string transform type is required"
                      #   `kubectl get managed` 이 계속 비어 있으면 XR 의 status.conditions 를 봐라.
                      type: Format
                      fmt: "skills-%s-bucket"

          - name: table
            base:
              apiVersion: dynamodb.aws.m.upbound.io/v1beta1
              kind: Table
              spec:
                forProvider:
                  region: ap-northeast-2
                  billingMode: PAY_PER_REQUEST
                  hashKey: id
                  attribute:
                    - name: id
                      type: S
            patches:
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.appName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "skills-%s-table"
