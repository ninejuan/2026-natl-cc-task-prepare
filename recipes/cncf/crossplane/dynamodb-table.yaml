apiVersion: dynamodb.aws.upbound.io/v1beta2   # ★ v1beta1 은 provider v2.6.0 부터 deprecated
kind: Table
metadata:
  name: skills-table
  annotations:
    crossplane.io/external-name: skills-crossplane-table
spec:
  deletionPolicy: Delete
  forProvider:
    region: ap-northeast-2
    billingMode: PAY_PER_REQUEST
    hashKey: booking_id
    attribute:
      - name: booking_id
        type: S
    pointInTimeRecovery:            # ★ v1beta2 에서 list → object 로 바뀜
      enabled: true
    tags:
      Name: skills-crossplane-table
  providerConfigRef:
    name: default
