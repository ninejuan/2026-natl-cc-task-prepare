# Secrets Manager 에 {"username":"admin","password":"..."} 가 있을 때 필요한 키만 뽑는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: skills/db/credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: skills/db/credentials
        property: password
