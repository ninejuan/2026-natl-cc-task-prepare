# 네임스페이스 한정. 이 네임스페이스의 SA 로 Role 을 assume 하므로 테넌트별 권한 분리가 된다.
# 이 SA 에 eks.amazonaws.com/role-arn annotation 이 붙어 있어야 한다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: app-secretsmanager
  namespace: app
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      role: arn:aws:iam::000000000000:role/skills-app-secrets-role
      auth:
        jwt:
          serviceAccountRef:
            name: app-sa
