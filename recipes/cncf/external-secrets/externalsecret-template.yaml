# 값을 조합해 연결문자열이나 설정파일로 만든다. 앱이 DSN 하나만 받는 경우.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-dsn
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-dsn
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:5432/skills"
        app.conf: |
          [database]
          host = {{ .host }}
          user = {{ .username }}
  dataFrom:
    - extract:
        key: skills/db/credentials
