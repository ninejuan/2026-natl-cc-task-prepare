# JSON 시크릿의 모든 최상위 키를 Secret 키로 그대로 펼친다. 키 이름을 일일이 안 적어도 된다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: app-secret
  dataFrom:
    - extract:
        key: skills/app/config
