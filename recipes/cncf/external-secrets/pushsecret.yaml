# 역방향. 클러스터에서 만든 값(예: 랜덤 생성 비밀번호)을 Secrets Manager 에 올린다.
# Role 에 secretsmanager:CreateSecret, PutSecretValue, TagResource 가 추가로 필요하다.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-app-secret
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRefs:
    - name: aws-secretsmanager
      kind: ClusterSecretStore
  selector:
    secret:
      name: app-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: skills/app/generated
          property: password
