# 역방향. 클러스터에서 만든 값(예: 랜덤 생성 비밀번호)을 Secrets Manager 에 올린다.
#
# ★ 필요한 IAM 권한(실검증). 문서에 흔히 적힌 3개만으로는 반드시 실패한다:
#     secretsmanager:DescribeSecret        ← 없으면 AccessDenied (첫 번째 벽)
#     secretsmanager:CreateSecret
#     secretsmanager:PutSecretValue
#     secretsmanager:TagResource
#     secretsmanager:GetResourcePolicy
#     secretsmanager:DeleteResourcePolicy  ← 없으면 AccessDenied (두 번째 벽)
#     secretsmanager:PutResourcePolicy
#   에러는 status.conditions[0].message 에만 나오므로
#   `kubectl -n app get pushsecret <name> -o jsonpath='{.status.conditions[0].message}'` 로 본다.
#
# ★★ PushSecret 은 값을 **SecretBinary** 로 쓴다(실검증).
#   그래서 `aws secretsmanager get-secret-value --query SecretString` 은 `None` 을 돌려준다.
#   "Synced 인데 값이 비어 보인다" 로 헤매기 딱 좋다. 확인은 이렇게:
#     aws secretsmanager get-secret-value --secret-id skills/app/generated \
#       --query SecretBinary --output text | base64 -d
#   (채점이 SecretString 을 본다면 PushSecret 대신 CLI 로 직접 put-secret-value 하는 편이 안전하다)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-app-secret
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRefs:
    - name: aws-secretsmanager
      kind: ClusterSecretStore
  selector:
    secret:
      name: app-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: skills/app/generated
          property: password
