# 클러스터 스코프. metadata.namespace 를 넣으면 안 된다.
# 컨트롤러 SA(external-secrets)에 붙은 IRSA 로 인증하므로 auth 블록이 없다.
#
# ★★ IRSA 는 **컨트롤러 SA 이름을 정확히** 맞춰야 한다(실검증).
#   helm 차트는 SA 이름에 릴리스 이름을 붙인다 — `helm install eso external-secrets/external-secrets`
#   로 깔면 SA 는 `external-secrets` 가 아니라 **`eso-external-secrets`** 다.
#   엉뚱한 SA 에 어노테이션을 달면 컨트롤러가 **노드 인스턴스 role 로 폴백**한다.
#   릴리스 이름을 `external-secrets` 로 하거나 `--set serviceAccount.name=external-secrets` 로 고정하라.
#   확인: kubectl -n external-secrets get pod -o jsonpath='{.items[0].spec.serviceAccountName}'
#
# ★★ 이때 **ClusterSecretStore 는 그대로 `Valid`** 로 뜬다(실검증). Store 가 Valid 라고
#   권한이 맞는 게 아니다. 진짜 신호는 ExternalSecret 쪽이다:
#     kubectl -n app get externalsecret -o custom-columns=NAME:.metadata.name,READY:.status.conditions[0].reason
#   여기서 `SecretSyncedError` 면 십중팔구 SA/IRSA 문제다.
#
# ★ 어노테이션을 고친 뒤에는 반드시 컨트롤러 재시작(rollout restart). 토큰은 파드 기동 시 주입된다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
