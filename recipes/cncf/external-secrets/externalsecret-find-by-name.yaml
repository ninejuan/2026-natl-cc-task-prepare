# 이름 패턴으로 여러 시크릿을 한 Secret 에 모은다. rewrite 로 키 접두어를 떼낸다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: all-app-secrets
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: all-app-secrets
  dataFrom:
    - find:
        name:
          regexp: "^skills/app/.*"
      rewrite:
        - regexp:
            source: "skills/app/(.*)"
            target: "$1"
