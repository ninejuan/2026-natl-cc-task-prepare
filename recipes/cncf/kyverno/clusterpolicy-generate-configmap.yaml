# 네임스페이스가 생기면 ConfigMap 을 자동으로 만든다. synchronize 로 원본 변경도 전파한다.
# generate 는 Kyverno 의 background-controller 가 수행하므로 background: true 여야 한다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-config
spec:
  background: true
  rules:
    - name: create-configmap
      match:
        any:
          - resources:
              kinds: ["Namespace"]
      generate:
        apiVersion: v1
        kind: ConfigMap
        name: default-config
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          data:
            AWS_REGION: ap-northeast-2
            LOG_LEVEL: info
