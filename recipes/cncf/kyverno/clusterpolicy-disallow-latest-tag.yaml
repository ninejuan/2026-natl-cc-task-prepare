apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: false
  rules:
    - name: require-explicit-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["prod"]
      validate:
        failureAction: Enforce
        message: "이미지에 명시적 태그가 필요하며 ':latest' 는 허용되지 않습니다"
        pattern:
          spec:
            containers:
              - name: "*"
                image: "!*:latest"
