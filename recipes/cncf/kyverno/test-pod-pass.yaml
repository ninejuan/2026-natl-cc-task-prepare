# 통과해야 하는 파드. 태그 명시 + 필수 label + resources 있음.
apiVersion: v1
kind: Pod
metadata:
  name: test-pass
  namespace: prod
  labels:
    skills.kr/env: prod
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/alpine:3.21
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
