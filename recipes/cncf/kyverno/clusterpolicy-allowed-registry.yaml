# CEL 방식. pattern 으로 표현하기 어려운 조건(문자열 함수, 전체 순회)에 쓴다.
#
# ★ 허용 목록은 반드시 "베이스 이미지 레지스트리"까지 포함시켜라.
#   우리 ECR 하나만 허용하면 public.ecr.aws 에서 받는 nginx/alpine 사이드카·초기화 컨테이너가
#   전부 막혀서 클러스터가 안 뜬다. 실제로 test-pod-pass.yaml 이 이것 때문에 거부됐다(실검증).
#
# ★★ 그리고 시스템/애드온 네임스페이스는 반드시 exclude 하라.
#   Kyverno 가 Deployment 용 규칙(`autogen-only-our-ecr`)을 자동 생성하기 때문에
#   이 정책이 살아 있으면 `kubectl rollout restart deploy` 조차 거부된다(실검증 —
#   ESO 컨트롤러 재시작이 이것 때문에 막혀서 IRSA 재적용이 안 됐다).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allowed-registry
spec:
  background: false
  rules:
    - name: only-our-ecr
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - cert-manager
                - istio-system
                - monitoring
                - observability
                - external-secrets
                - keda
                - argocd
                - falco
                - crossplane-system
      validate:
        failureAction: Enforce
        cel:
          variables:
            - name: allowed
              expression: >-
                ['000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/', 'public.ecr.aws/']
          expressions:
            - expression: >-
                object.spec.containers.all(c,
                  variables.allowed.exists(p, c.image.startsWith(p))
                  && c.image.contains(':') && !c.image.endsWith(':latest'))
              message: "허용된 레지스트리(사내 ECR / public.ecr.aws)의 태그 지정 이미지만 사용할 수 있습니다"
