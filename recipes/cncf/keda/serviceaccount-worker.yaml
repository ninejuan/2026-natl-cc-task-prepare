# 워커가 SQS 에서 메시지를 실제로 받아 처리하는 권한. KEDA operator 의 Role 과는 별개다.
# KEDA: 큐 길이만 읽는다 (GetQueueAttributes). 워커: ReceiveMessage/DeleteMessage 가 필요하다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/skills-worker-role
