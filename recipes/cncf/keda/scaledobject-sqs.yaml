# queueLength = 파드 1개당 처리할 메시지 수. 메시지 12개 / queueLength 5 => 3 파드.
# pollingInterval 을 짧게 둬야 채점 대기(3분) 안에 스케일아웃이 관측된다.
#
# ★★ ScaledObject 를 **대상 Deployment 보다 먼저** 만들면 영구히 고장난다(실검증).
#   status 가 `ScaledObjectCheckFailed: deployments.apps "worker" not found` 로 굳고,
#   나중에 Deployment 를 만들어도 **KEDA 가 재시도하지 않는다.** HPA 도 안 생긴다.
#   → 반드시 Deployment 를 먼저 올리고 ScaledObject 를 만든다.
#     이미 이 상태라면 `kubectl -n app delete scaledobject <name>` 후 다시 apply.
#   확인: kubectl -n app get scaledobject → READY 가 True 여야 한다.
#
# ★ minReplicaCount: 0 이어도 `kubectl get hpa` 의 MINPODS 는 **1** 로 보인다.
#   0↔1 은 KEDA 가 직접 하고 HPA 는 1↔max 만 담당하기 때문이다. 버그가 아니다.
#
# 실측(실검증): 메시지 30개 / queueLength 5 → 0 → 5 파드 (약 15초), 큐 비운 뒤 → 0 (약 20초).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaledobject
  namespace: app
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: sqs-auth
      metadata:
        queueURL: https://sqs.ap-northeast-2.amazonaws.com/000000000000/skills-queue
        queueLength: "5"
        awsRegion: ap-northeast-2
        # 처리 중(NotVisible) 메시지까지 셀지 여부
        scaleOnInFlight: "true"
