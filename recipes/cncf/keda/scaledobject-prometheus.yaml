# Prometheus 쿼리 결과로 스케일. RPS·응답시간·커스텀 메트릭 기반 요구에 쓴다.
# serverAddress 는 kube-prometheus-stack 설치 시 prometheus-operated 또는 <release>-prometheus 서비스.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-prom
  namespace: app
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        query: sum(rate(http_requests_total{namespace="app"}[1m]))
        threshold: "100"
        # activationThreshold 미만이면 0 으로 내린다 (minReplicaCount 0 일 때만 의미 있음)
        activationThreshold: "5"
