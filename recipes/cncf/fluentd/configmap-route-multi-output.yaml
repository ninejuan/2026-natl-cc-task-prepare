# 하나의 입력을 조건에 따라 다른 목적지로 나눈다. Fluent Bit 으로는 번거로운 구성.
# ERROR 는 OpenSearch(검색용), 전체는 S3(보관용).
#
# ★★ 이 설정은 `-cloudwatch-` 이미지로는 **안 돌아간다**(실검증).
#   fluent/fluentd-kubernetes-daemonset:v1.17-debian-cloudwatch-1 에 들어 있는 플러그인은
#   기동 로그에 전부 찍힌다 — 실측 목록:
#     cloudwatch-logs / concat / detect-exceptions / grok-parser / json-in-json-2 /
#     kubernetes_metadata_filter / multi-format-parser / parser-cri / prometheus /
#     record-modifier / rewrite-tag-filter / systemd
#   → opensearch 도 s3 도 없다. 그대로 쓰면 기동 시 config error 로 죽는다.
#   목적지에 맞는 태그를 골라라(하나의 이미지에 전부 들어 있지 않다):
#     -cloudwatch-  : CloudWatch Logs
#     -s3-          : S3
#     -opensearch-  : OpenSearch
#   두 곳 이상으로 보내야 하면 이미지를 직접 빌드하거나(gem install), DaemonSet 을 두 개 띄운다.
#   확인: kubectl -n logging logs ds/fluentd | grep "gem 'fluent-plugin
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-route-config
  namespace: logging
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/app-*_app_*.log
      pos_file /var/log/fluentd-app.log.pos
      tag app.raw
      read_from_head true
      <parse>
        @type cri
      </parse>
    </source>

    <filter app.raw>
      @type parser
      key_name message
      reserve_data true
      <parse>
        @type json
      </parse>
    </filter>

    # level 값에 따라 태그를 갈아끼운다. rewrite_tag_filter 가 분기의 핵심.
    <match app.raw>
      @type rewrite_tag_filter
      <rule>
        key level
        pattern /^(ERROR|FATAL)$/
        tag app.error
      </rule>
      <rule>
        key level
        pattern /.+/
        tag app.normal
      </rule>
    </match>

    # 에러만 OpenSearch 로
    <match app.error>
      @type copy
      <store>
        @type opensearch
        host skills-os.ap-northeast-2.es.amazonaws.com
        port 443
        scheme https
        logstash_format true
        logstash_prefix app-error
        <buffer>
          flush_interval 5s
        </buffer>
      </store>
      <store>
        @type s3
        s3_bucket skills-logs-000
        s3_region ap-northeast-2
        path errors/
        <buffer>
          flush_interval 60s
        </buffer>
      </store>
    </match>

    # 나머지는 S3 보관만
    <match app.normal>
      @type s3
      s3_bucket skills-logs-000
      s3_region ap-northeast-2
      path all/
      <buffer>
        flush_interval 60s
      </buffer>
    </match>
