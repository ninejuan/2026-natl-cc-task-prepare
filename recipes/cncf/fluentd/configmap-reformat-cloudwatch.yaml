# 과제지가 지정한 스키마로 로그를 재조립하는 구성.
# 목표 출력:
#   {"timestamp":"...","method":"POST","path":"/v1/book","status_code":200,"client_ip":"10.0.12.1"}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    <source>
      @type tail
      @id in_tail_container_logs
      path /var/log/containers/app-*_app_*.log
      pos_file /var/log/fluentd-app.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type cri
      </parse>
    </source>

    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
    </filter>

    # 앱이 JSON 한 줄로 찍는 경우 log 필드를 펼친다. reserve_data 를 켜야 원래 필드가 남는다.
    <filter kubernetes.**>
      @type parser
      key_name message
      reserve_data true
      remove_key_name_field false
      emit_invalid_record_to_error false
      <parse>
        @type json
      </parse>
    </filter>

    # /health 로그는 버린다
    <filter kubernetes.**>
      @type grep
      <exclude>
        key path
        pattern /^\/health$/
      </exclude>
    </filter>

    # 중첩 메타데이터에서 필요한 값만 끌어올리고, 나머지는 전부 지운다.
    # remove_keys 를 빼면 kubernetes 블록이 그대로 나가서 형식이 안 맞는다.
    <filter kubernetes.**>
      @type record_transformer
      enable_ruby true
      <record>
        timestamp ${time.utc.strftime('%Y-%m-%dT%H:%M:%SZ')}
        # ★ 순서 주의: 이렇게 쓰면 **파드 IP 가 우선**한다(실검증 결과 192.168.x.x 가 들어갔다).
        #   과제지가 "요청한 클라이언트 IP" 를 원하면 순서를 뒤집어라:
        #     client_ip ${record["client_ip"] || record.dig("kubernetes", "pod_ip")}
        client_ip ${record.dig("kubernetes", "pod_ip") || record["client_ip"]}
        status_code ${record["status_code"].to_i}
        # ★ 아래 match 의 log_stream_name_key 가 가리킬 최상위 키를 여기서 만들어 둔다.
        #   remove_keys 로 kubernetes 블록을 지우기 **전에** 계산되므로 값이 살아 있다.
        kubernetes_pod ${record.dig("kubernetes", "pod_name")}
      </record>
      # ★ cri 파서가 넣는 `time` 도 같이 지워야 출력 스키마가 정확히 맞는다(실검증에서 남아 있었다).
      remove_keys kubernetes,docker,stream,logtag,message,log,time,$.kubernetes.labels
    </filter>

    # ★★ log_stream_name / use_tag_as_stream / log_stream_name_key 는 **셋 중 하나만** 쓴다.
    #   `use_tag_as_stream false` 처럼 **false 로 명시해도 "설정한 것"으로 세어서** 기동이 실패한다(실검증):
    #     [error]: config error ... error="Set only one of log_stream_name, use_tag_as_stream and log_stream_name_key"
    #   fluentd 는 이 경우 파드가 CrashLoop 도 안 되고 그냥 안 뜬다 — 반드시 로그를 봐라.
    #     kubectl -n logging logs ds/fluentd --tail=30
    <match kubernetes.**>
      @type cloudwatch_logs
      region ap-northeast-2
      log_group_name /skills/eks/app
      log_stream_name_key kubernetes_pod
      # ★★ log_stream_name_key 가 가리키는 키가 **레코드에 없으면** 로그가 통째로 버려진다(실검증).
      #   에러가 아니라 경고 한 줄만 반복해서 나온다 — 로그 그룹은 생기는데 스트림이 안 생긴다:
      #     [warn]: #0 stream_name is nil (group_name=/skills/eks/app)
      #   위 record_transformer 의 remove_keys 가 kubernetes 블록을 지우기 때문에,
      #   kubernetes_pod 를 최상위 키로 미리 만들어 두지 않으면 반드시 이 상태가 된다.
      # ★ 출력 JSON 스키마에 kubernetes_pod 가 끼면 안 될 때는 이 옵션으로 전송 직전에 뺀다.
      remove_log_stream_name_key true
      auto_create_stream true
      json_handler json
      <buffer>
        flush_interval 5s
        chunk_limit_size 2m
        retry_forever false
        retry_max_times 5
      </buffer>
    </match>
