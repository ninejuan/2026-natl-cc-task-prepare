# helm upgrade --install istio-ingress istio/gateway -n istio-ingress --create-namespace \
#   -f values-ingressgateway-nlb.yaml
#
# ALB 는 Istio Gateway 와 궁합이 나쁘다. NLB 로 L4 그대로 넘기는 게 짧다.

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-name: skills-istio-nlb

resources:
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

nodeSelector:
  skills/node: addon
