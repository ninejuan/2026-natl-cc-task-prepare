# 서비스 간 접근 제어. NetworkPolicy 와 달리 ServiceAccount 신원과 HTTP 메서드/경로로 판단한다.
# ALLOW 정책이 하나라도 있으면 매칭 안 되는 요청은 거부된다(기본 거부로 전환).
#
# 실검증(사이드카 있는 클라이언트에서):
#   GET  /health   → 200   (rule 2: from 없음 = 누구나)
#   POST /health   → 403   (메서드 불일치)
#   GET  /version  → 403   (어느 rule 에도 안 걸림 = 기본 거부)
#   GET  /v1/book/ → 403   (principal 불일치. frontend-sa 로 온 요청이 아님)
#
# ★ 적용이 프록시까지 퍼지는 데 30초 이상 걸린다(실검증: 25초 뒤엔 아직 200 이었다).
#   "정책을 걸었는데 아직 통과한다" 면 곧바로 정책을 의심하지 말고 재시도부터 하라:
#     for i in $(seq 1 12); do
#       kubectl -n app exec <client> -- curl -s -o /dev/null -w "%{http_code}\n" http://app-svc:8080/version
#       sleep 5
#     done
#
# ★ 사이드카 없는 클라이언트에서는 이 정책이 **아예 적용되지 않는다**(프록시가 없으니 검사도 없다).
#   반대로 PeerAuthentication STRICT 는 사이드카 없는 클라이언트를 끊는다(실검증: 000).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: app-authz
  namespace: app
spec:
  selector:
    matchLabels:
      app: app
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/app/sa/frontend-sa"]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/v1/book", "/v1/book/*"]
    # 헬스체크는 누구나
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/health"]
