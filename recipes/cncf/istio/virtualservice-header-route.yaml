# 헤더로 분기 + 재시도 + 타임아웃. "특정 헤더를 가진 요청만 새 버전으로" 요구에 쓴다.
# match 는 위에서부터 평가되므로 구체적인 규칙을 먼저 둔다.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: app-header
  namespace: app
spec:
  hosts:
    - "*"
  gateways:
    - app-gateway
  http:
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: app-svc
            subset: v2
            port:
              number: 8080
    - route:
        - destination:
            host: app-svc
            subset: v1
            port:
              number: 8080
      timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx,reset,connect-failure
