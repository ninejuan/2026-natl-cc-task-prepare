# Operator(또는 ADOT 애드온)를 깔았을 때의 설정 방법. values 대신 CR 로 콜렉터를 정의한다.
# mode: sidecar 면 파드에 annotation 을 붙여 콜렉터를 주입한다:
#   sidecar.opentelemetry.io/inject: "true"
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: app
spec:
  mode: sidecar
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
    exporters:
      otlp:
        endpoint: otel-gateway-opentelemetry-collector.monitoring.svc:4317
        tls:
          insecure: true
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, debug]
