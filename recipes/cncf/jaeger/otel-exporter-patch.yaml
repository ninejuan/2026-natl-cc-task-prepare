# ../opentelemetry/values-collector-gateway.yaml 의 config 에 합칠 조각.
# X-Ray 와 Jaeger 로 동시에 내보낸다. Jaeger 는 OTLP 를 직접 받으므로 otlp 익스포터를 쓴다.
# (jaeger 전용 익스포터는 제거됐다. otlp 를 쓴다.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-jaeger-snippet
  namespace: monitoring
data:
  snippet.yaml: |
    exporters:
      otlp/jaeger:
        endpoint: jaeger.observability.svc:4317
        tls:
          insecure: true
      awsxray:
        region: ap-northeast-2

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray, otlp/jaeger]
