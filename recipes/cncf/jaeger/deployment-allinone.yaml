apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      nodeSelector:
        skills/node: addon
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          args:
            - --memory.max-traces=50000        # 없으면 무한히 쌓여 OOM
          env:
            - name: COLLECTOR_OTLP_ENABLED     # 4317/4318 을 여는 스위치
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: memory
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
