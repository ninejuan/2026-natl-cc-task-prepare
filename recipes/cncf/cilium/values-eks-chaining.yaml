# helm upgrade --install cilium cilium/cilium --version 1.19.5 -n kube-system -f values-eks-chaining.yaml
#
# VPC CNI 를 그대로 두고 Cilium 을 정책 엔진 + 관측 도구로만 얹는다.
#
# ★ 실검증: 깨끗한 EKS 1.35 클러스터에서 이 값으로 정상 동작했다
#   (L3/L4·L7 HTTP·FQDN·Clusterwide 정책 전부 통과 — README.md 의 결과표 참조).
#
# ★★★ 단, **다른 CNI 정책 엔진(Calico 등)을 깔았다 지운 노드 위에는 설치하지 마라.**
#   같은 값으로 설치했더니 파드 egress 가 전멸했다(CoreDNS 가 VPC 리졸버로 i/o timeout,
#   파드 안에서 apk add 조차 실패). endpointRoutes / ipam delegated-plugin 을 더해도 안 됐고,
#   **노드그룹을 새로 만들어 옛 노드를 버리자마자 같은 값으로 정상 동작했다.**
#   → CNI 를 바꿀 때는 노드를 교체한다. helm uninstall 만으로는 노드가 안 깨끗해진다.
#
# ★ 그리고 제거해도 /etc/cni/net.d/05-cilium.conflist 가 남아 새 파드가 안 뜬다.
#   응급 복구(hostNetwork DaemonSet)는 README.md 에 있다.

cni:
  chainingMode: aws-cni
  exclusive: false          # ★ 빠뜨리면 Cilium 이 CNI 설정을 독점해 VPC CNI 와 충돌한다

# ENI IP 가 VPC 에서 직접 라우팅되므로 터널링/마스커레이딩이 필요 없다
routingMode: native
enableIPv4Masquerade: false
enableIPv6Masquerade: false

# kube-proxy 는 그대로 둔다. 대체하려면 클러스터 재구성이 필요하다.
kubeProxyReplacement: "false"

# L7 정책을 쓰려면 Envoy 가 필요하다
l7Proxy: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

operator:
  replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
