# 실제로는 아래로 만든다. 이 파일은 키 이름 참고용.
#   kubectl create secret generic keycloak -n keycloak \
#     --from-literal=admin-password='Skills!2026' \
#     --from-literal=db-password='Skills!2026pg'
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: keycloak
stringData:
  admin-password: Skills!2026
  db-password: Skills!2026pg
