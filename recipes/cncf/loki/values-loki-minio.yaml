# S3 를 만들 시간도 없을 때. MinIO 서브차트로 클러스터 안에서 끝낸다.
# 파드가 하나 더 뜨고 2026-10-31 제거 예정이라, 시간이 있으면 S3 쪽을 쓴다.

# ★★★ deploymentMode 에 **`Monolithic` 같은 없는 값을 쓰면 조용히 아무것도 안 뜬다**(실검증).
#   helm 이 오류를 내지 않고 통과시키는데, 실제로는 loki 파드가 하나도 안 만들어지고
#   `loki-gateway` 만 뜬다. "설치 성공" 메시지까지 정상으로 보여서 알아채기 어렵다.
#   차트 7.3.0 기준 허용값은 세 개뿐이다:
#     SingleBinary    — 1개 바이너리. 대회에선 이걸 쓴다
#     SimpleScalable  — read/write/backend 3종. **오브젝트 스토리지 필수**
#     Distributed     — 마이크로서비스 전개
#   확인: helm show values grafana/loki | grep -A10 'Deployment mode'
#         kubectl -n monitoring get sts,deploy | grep loki    ← loki-0 이 있어야 한다
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
  pattern_ingester:
    enabled: true

ignoreMinioDeprecation: true
minio:
  enabled: true

singleBinary:
  replicas: 1
  nodeSelector:
    skills/node: addon

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
