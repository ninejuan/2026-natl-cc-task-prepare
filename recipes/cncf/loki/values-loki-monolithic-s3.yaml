# helm upgrade --install loki grafana/loki -n monitoring --create-namespace -f values-loki-monolithic-s3.yaml
# 버킷 이름과 role ARN 을 바꿔서 쓴다.

# ★★★ deploymentMode 에 **`Monolithic` 같은 없는 값을 쓰면 조용히 아무것도 안 뜬다**(실검증).
#   helm 이 오류를 내지 않고 통과시키는데, 실제로는 loki 파드가 하나도 안 만들어지고
#   `loki-gateway` 만 뜬다. "설치 성공" 메시지까지 정상으로 보여서 알아채기 어렵다.
#   차트 7.3.0 기준 허용값은 세 개뿐이다:
#     SingleBinary    — 1개 바이너리. 대회에선 이걸 쓴다
#     SimpleScalable  — read/write/backend 3종. **오브젝트 스토리지 필수**
#     Distributed     — 마이크로서비스 전개
#   확인: helm show values grafana/loki | grep -A10 'Deployment mode'
#         kubectl -n monitoring get sts,deploy | grep loki    ← loki-0 이 있어야 한다
deploymentMode: SingleBinary

loki:
  auth_enabled: false          # 멀티테넌시 끔. 켜면 모든 요청에 X-Scope-OrgID 헤더가 필요하다
  commonConfig:
    replication_factor: 1      # 1레플리카에서 기본값 3 이면 쓰기가 실패한다
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
    reject_old_samples: false
  storage:
    type: s3
    bucketNames:
      chunks: skills-loki-000
      ruler: skills-loki-000
      admin: skills-loki-000
    s3:
      region: ap-northeast-2
      s3ForcePathStyle: false
  pattern_ingester:
    enabled: true

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/skills-loki-role

singleBinary:
  replicas: 1
  nodeSelector:
    skills/node: addon
  persistence:
    enabled: false             # 청크는 S3 로 간다. WAL 만 잃는다
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

minio:
  enabled: false

# Monolithic 을 켜도 아래 기본값이 남아 파드가 같이 뜬다. 전부 0 으로 내린다.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
