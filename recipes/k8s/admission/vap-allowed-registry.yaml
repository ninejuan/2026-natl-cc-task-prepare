# "우리 ECR 이미지만 허용" 류 요구.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: allowed-registry
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/'))
      message: "허용된 ECR 레지스트리의 이미지만 사용할 수 있습니다"
