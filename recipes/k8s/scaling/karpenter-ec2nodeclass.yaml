# 서브넷/SG 는 태그로 발견한다. VPC 쪽에 karpenter.sh/discovery=<클러스터명> 태그가 먼저 붙어 있어야 한다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skills-nodeclass
spec:
  role: KarpenterNodeRole-skills-eks
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: skills-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: skills-eks
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 2
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: skills-karpenter-node
