# EKS Access Entry 로 IAM Principal 을 이 그룹에 매핑하면 IAM 사용자에게 이 권한이 붙는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: app
  - kind: Group
    name: skills-readers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-reader
  apiGroup: rbac.authorization.k8s.io
