# ★★ Gateway 경로에서 이게 없으면 ALB 가 절대 안 뜬다(실검증).
#
# Ingress 에는 `alb.ingress.kubernetes.io/target-type: ip` 어노테이션이 있지만
# Gateway API 에는 그 자리가 없다. LBC 의 **기본값이 instance** 라서
# 백엔드 Service 가 ClusterIP 면 이렇게 죽는다:
#
#   Gateway .status: Accepted=False reason=Invalid
#   LBC 로그: "TargetGroup port is empty. When using Instance targets,
#              your service must be of type 'NodePort' or 'LoadBalancer'"
#
# Gateway 는 주소(ALB DNS)까지는 받아놓고 Programmed 가 Pending 에서 멈춰서
# "ALB 는 생긴 것 같은데 왜 안 되지" 로 시간을 버리기 딱 좋다.
#
# 해결: Service 마다 TargetGroupConfiguration 으로 targetType: ip 를 지정한다.
#      (또는 Service 를 NodePort 로 바꾼다 — 파드 직결이 아니라 권장하지 않음)
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: app-svc-tgconfig
  namespace: app
spec:
  targetReference:
    group: ""          # core
    kind: Service
    name: app-svc      # 이 Service 하나에만 적용된다. 백엔드마다 하나씩 만든다
  defaultConfiguration:
    targetType: ip     # ★ 파드 IP 직결. 기본값(instance)이면 ClusterIP 서비스에서 실패
    healthCheckConfig:
      healthCheckPath: /health
      healthCheckInterval: 10
      healthyThresholdCount: 2
