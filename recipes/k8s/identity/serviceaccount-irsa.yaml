# IRSA: 이 annotation 이 채점 대상이다.
#   kubectl get sa app-sa -n app -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}'
# Pod Identity 를 쓰면 annotation 없이 aws eks create-pod-identity-association 으로 연결한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/skills-app-irsa-role
